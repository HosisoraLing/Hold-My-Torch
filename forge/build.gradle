plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.36'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}
group = 'dev.holdmytorch'
version = '0.1.2'
base.archivesName = 'hold-my-torch'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
sourceSets.main.java.srcDir '../common/src/main/java'
sourceSets.main.resources.srcDir '../common/src/main/resources'
minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        client {
            workingDirectory project.file('run')
            mods { holdmytorch { source sourceSets.main } }
        }
    }
}
repositories {
    if (providers.gradleProperty('forgeMirror').isPresent()) maven { url = 'https://bmclapi2.bangbang93.com/maven' }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
}
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}
mixin {
    add sourceSets.main, 'holdmytorch.refmap.json'
    config 'holdmytorch.mixins.json'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 17 }
tasks.named('jar') {
    archiveClassifier = 'mc1.20.1-forge'
    from('../LICENSE')
    manifest.attributes('MixinConfigs': 'holdmytorch.mixins.json')
    finalizedBy 'reobfJar'
}
