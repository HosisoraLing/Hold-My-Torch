plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.141'
}
group = 'dev.holdmytorch'
version = '0.1.2'
base.archivesName = 'hold-my-torch'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
sourceSets.main.java.srcDir '../common/src/main/java'
sourceSets.main.resources.srcDir '../common/src/main/resources'
neoForge {
    version = '21.1.228'
    runs { client { client() } }
    mods { holdmytorch { sourceSet sourceSets.main } }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
// NeoForge uses Mojang names at runtime; only the Forge build needs an SRG refmap.
tasks.named('processResources') {
    inputs.property('omitForgeRefmap', true)
    filesMatching('holdmytorch.mixins.json') { filter { line -> line.contains('"refmap"') ? '' : line } }
}
tasks.named('jar') {
    archiveClassifier = 'mc1.21.1-neoforge'
    from('../LICENSE')
}
